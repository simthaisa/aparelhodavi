<meta name="color-scheme" content="light only">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rifa solidária: audição do Davi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style id="css">:root{
  --paper:#FFFEFB; --card:#FFFFFF; --ink:#33405C; --ink2:#5E6884;
  --teal:#4FB3B5; --teal-l:#A6DCD9; --sky:#B5DDEE; --peach:#FFC7A8; --coral:#F7739E; --mustard:#EDBD50; --mustard-l:#F6DC97; --pink:#F8BFCB; --mint:#B8E4D2;
  --line:rgba(34,34,34,.14);
  --t-teal:#0F8489; --t-coral:#D6336E; --t-plum:#7A4CD6; --t-mustard:#1F73CC; --t-blue:#1F73CC; --t-orange:#D2561C; --t-body:#33405C; --blue-l:#BFDDF7; --lilac-l:#DCCBFA; --pink-l:#FFD3E3;
  --hand:"Fredoka","Segoe Print","Bradley Hand","Chalkboard SE","Comic Sans MS",cursive;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light only; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  background:#FFFEFB;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;overflow-x:clip;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;background:#FFFEFB}
body{margin:0;min-height:100%;background:#FFFEFB;color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;overflow-x:clip}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.page{position:relative;overflow:hidden;min-height:100%}
main{max-width:560px;margin:0 auto;padding:0 20px 150px;position:relative;z-index:1}

/* aquarela */
.paint{position:absolute;pointer-events:none;z-index:0;mix-blend-mode:multiply}
.paint svg{width:100%;height:100%;display:block;overflow:visible}
.bg .paint{opacity:.85}
section,header{position:relative}
.in{position:relative;z-index:1}

/* ícones */
.ico{position:absolute;z-index:2;pointer-events:none}
.ico svg{display:block;width:100%;height:auto}
.wave{display:flex;align-items:center;gap:4px;height:40px}
.wave i{display:block;width:5px;border-radius:3px}

/* topo */
.hero{text-align:center;padding:44px 0 6px}
.photo{position:relative;width:min(62vw,236px);aspect-ratio:1;margin:0 auto 30px}
.photo .ph{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block;position:relative;z-index:1;border:6px solid #fff}
.photo::before{content:"";position:absolute;inset:-6px;border-radius:50%;border:3px solid var(--mustard);z-index:1}
h1{font-family:var(--hand);font-weight:400;font-size:clamp(38px,10.5vw,52px);line-height:1.08;margin:0 0 16px;letter-spacing:-.015em}
.lead{margin:0 auto;max-width:30em;color:var(--ink2)}

/* painéis pintados */
.panel{position:relative;margin-top:36px;padding:26px 24px}
.panel > .paint{inset:-12px -16px;opacity:.95}
.panel.framed::after{content:"";position:absolute;inset:4px 2px;border:2px solid rgba(70,55,50,.5);border-radius:22px 26px 24px 20px;z-index:1;pointer-events:none}
h2{font-family:var(--hand);font-weight:400;font-size:30px;line-height:1.15;margin:46px 0 6px;color:var(--t-teal)}
h2 .em{font-size:.85em;margin-right:6px}
.panel h2{margin-top:0}
.sub{margin:0 0 16px;color:var(--ink2);font-size:15.5px}

.amount{font-family:var(--hand);font-size:52px;line-height:1;letter-spacing:-.02em}
.of{color:var(--ink2);font-size:15px;margin-top:4px}
.bar{position:relative;height:20px;border-radius:12px;background:rgba(255,255,255,.85);margin:16px 0 10px;overflow:hidden;box-shadow:inset 0 0 0 1.5px rgba(34,34,34,.12)}
.bar span{position:absolute;inset:0 auto 0 0;border-radius:12px;background:linear-gradient(90deg,#4FC3C8,#7CB8F2 40%,#B79BF5 70%,#F7739E);transition:width .9s cubic-bezier(.2,.8,.2,1)}
.goalrow{font-size:15px;color:var(--ink2)}
.goalrow b{color:var(--ink)}
.facts{list-style:none;margin:22px 0 0;padding:0;display:grid;gap:14px}
.facts li{display:grid;grid-template-columns:40px 1fr;align-items:center;gap:8px}
.facts .ic{font-size:30px;line-height:1;text-align:center}
.facts .k{font-weight:800;font-size:14px;letter-spacing:.02em;display:block}
.facts .v{font-family:var(--hand);font-size:21px;line-height:1.2}

/* números */
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--ink2);margin:0 0 14px}
.legend i{display:inline-block;width:16px;height:16px;border-radius:50%;vertical-align:-3px;margin-right:6px;border:2px solid var(--teal-l);background:#fff}
.legend .l-res{background:var(--pink-l);border-color:var(--pink-l)}
.legend .l-paid{background:var(--teal);border-color:var(--teal)}
.legend .l-sel{background:var(--coral);border-color:var(--coral)}
.ranges{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px 6px;scrollbar-width:none}
.ranges::-webkit-scrollbar{display:none}
.rg{flex:none;border:2px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-family:var(--hand);font-size:16px;cursor:pointer;white-space:nowrap}
.rg small{font-family:var(--body);font-size:12px;color:var(--ink2);margin-left:4px}
.rg[aria-pressed="true"]{background:var(--teal);color:#fff;border-color:var(--teal)}
.rg[aria-pressed="true"] small{color:rgba(255,255,255,.85)}
.rg-next{flex:none;align-self:center;font-size:13px;color:var(--ink2);padding:0 6px}
@media (min-width:640px){
 main{max-width:720px;padding-left:32px;padding-right:32px}
 .photo{width:260px}
 .panel{padding:30px 32px}
}
@media (min-width:980px){
 main{max-width:1180px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:44px;row-gap:56px;align-items:stretch;padding:0 48px 120px;
  grid-template-areas:"hero hero" "goal buy" "admin admin" "cart cart" "pix story" "upd upd"}
 main > *{min-width:0;margin-top:0!important}
 main > .hero{grid-area:hero;padding:64px 0 0}
 main > section[aria-labelledby="g-t"]{grid-area:goal}
 main > .buy{grid-area:buy}
 main > #adminbar{grid-area:admin}
 main > #adminbar:empty{display:none}
 main > section[aria-labelledby="n-t"]{grid-area:cart}
 main > .pix{grid-area:pix;align-self:start}
 main > .story{grid-area:story;align-self:start}
 main > .updated{grid-area:upd}
 .hero .in{display:grid;grid-template-columns:320px minmax(0,1fr);column-gap:72px;align-items:center;text-align:left;max-width:1000px;margin:0 auto}
 .hero .photo{grid-row:1 / span 3;width:320px;margin:0}
 .hero h1{font-size:64px;margin:0 0 18px;align-self:end}
 .hero .lead{margin:0;font-size:19px;max-width:30em}
 .hero .in > div:last-child{justify-content:flex-start!important;align-self:start}
 .panel{padding:34px 36px}
 main > section[aria-labelledby="g-t"] > .in{display:flex;flex-direction:column;justify-content:center;height:100%}
 section[aria-labelledby="n-t"] h2{margin-top:0}
 section[aria-labelledby="n-t"] .board{padding:26px 24px}
 #grid.grid{grid-template-columns:repeat(20,minmax(0,1fr));gap:10px}
 #grid .cell{font-size:15px;border-width:2px}
 .find{max-width:560px}
 .story h2{margin-top:0}
 .story p{font-size:17.5px}
 .story .sign{text-align:left}
}
#grid.grid{grid-template-columns:repeat(10,minmax(0,34px));gap:6px;justify-content:center}
#grid .cell{font-size:12px;border-width:1.5px}
@media (min-width:470px){#grid.grid{grid-template-columns:repeat(10,minmax(0,42px));gap:8px}#grid .cell{font-size:14px}}
@media (min-width:980px){#grid.grid{grid-template-columns:repeat(20,minmax(0,40px));gap:8px}#grid .cell{font-size:13px}}
.board{padding:20px 14px;margin-top:6px}
.board > .paint{inset:-8px -12px;opacity:.9}
.board .glaze{position:absolute;inset:10px 6px;border-radius:28px;background:rgba(255,255,255,.62);z-index:0}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;position:relative}
@media (min-width:360px){.grid{grid-template-columns:repeat(6,1fr);gap:9px}}
@media (min-width:470px){.grid{grid-template-columns:repeat(10,1fr);gap:8px}}
.cell{aspect-ratio:1;border-radius:50%;border:2.5px solid var(--teal-l);background:#fff;color:#222;font-family:var(--hand);font-size:17px;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0;position:relative;transition:transform .15s,background .15s}
.cell.c1{border-color:var(--pink)} .cell.c2{border-color:var(--blue-l)} .cell.c3{border-color:var(--lilac-l)}
.cell:active{transform:scale(.92)}
.cell.res{background:var(--pink-l);border-color:var(--pink-l)}
.cell.paid{background:var(--teal);border-color:var(--teal);color:#fff}
.cell.sel{background:var(--coral);border-color:var(--coral);color:#fff;transform:scale(1.1)}
.cell.flash{animation:flash 1.2s ease}
@keyframes flash{30%{box-shadow:0 0 0 5px var(--mustard)}}
.cell .who{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:1px;font-family:var(--body);font-size:9px;font-weight:700;white-space:nowrap;max-width:64px;overflow:hidden;text-overflow:ellipsis;color:var(--ink2)}
.admin-on .grid{row-gap:20px}
.cell.edited::after{content:"";position:absolute;top:-1px;right:-1px;width:10px;height:10px;border-radius:50%;background:var(--mustard);border:2px solid #fff}
.find{display:flex;align-items:center;gap:10px;margin-top:18px;font-size:15px;color:var(--ink2)}
.find input{width:120px;border:2px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:7px 14px;font:inherit}

/* pix */
.pixrow{display:flex;gap:10px;align-items:stretch;margin-top:8px;flex-wrap:wrap}
.pixkey{flex:1 1 200px;font-weight:800;font-size:17px;word-break:break-all;background:rgba(255,255,255,.8);border-radius:16px;padding:12px 14px}
.btn{border:0;border-radius:999px;padding:12px 22px;font-weight:800;font-size:16px;cursor:pointer;background:#222;color:#fff}
.btn.soft{background:#fff;color:#222;border:2px solid var(--line)}
.btn.coral{background:var(--coral);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.holder{margin:10px 0 0;color:var(--ink2);font-size:15px}
.story p{margin:0 0 14px;max-width:34em}
.story b{font-weight:800}
.sign{font-family:var(--hand);font-size:24px;line-height:1.35;margin-top:22px;text-align:center}
.updated{text-align:center;font-size:13px;color:var(--ink2);margin-top:36px}

/* barra fixa */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:rgba(255,254,251,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);transform:translateY(110%);transition:transform .25s ease}
.dock.show{transform:none}
.dock-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px}
.dock-txt{flex:1;font-size:14px;line-height:1.3;min-width:0}
.dock-txt b{font-family:var(--hand);font-size:21px;font-weight:400;display:block;white-space:nowrap}
.dock-txt .nums{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink2)}
.dock .btn{white-space:nowrap;flex:none}
.dock .clear{background:none;border:0;color:var(--ink2);text-decoration:underline;cursor:pointer;font-size:13px;padding:2px 0;margin-top:2px}

/* organizadora */
.adminbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:26px;padding:12px 16px;border-radius:18px;border:2px dashed #B79BF5;font-size:15px;background:rgba(255,255,255,.85)}
.adminbar .grow{flex:1;color:var(--ink2)}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-weight:800}
.switch input{width:20px;height:20px;accent-color:var(--teal)}
dialog{border:0;border-radius:26px;padding:0;max-width:420px;width:calc(100% - 32px);background:#fff;color:#222;box-shadow:0 20px 60px rgba(0,0,0,.2)}
dialog::backdrop{background:rgba(40,50,55,.35)}
.dlg{padding:24px}
.dlg h3{font-family:var(--hand);font-weight:400;font-size:28px;margin:0 0 10px;line-height:1.1}
.dlg label{display:block;font-size:14px;font-weight:800;margin:14px 0 5px}
.dlg input{width:100%;border:2px solid var(--line);background:#FFFEFB;color:#222;border-radius:14px;padding:10px 12px;font:inherit}
.dlg .hint{font-size:13px;color:var(--ink2);margin:5px 0 0}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.seg button{border:2px solid var(--line);background:#FFFEFB;border-radius:14px;padding:10px 4px;font-weight:800;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--teal);color:#fff;border-color:var(--teal)}
.dlg .row{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:#222;color:#fff;padding:10px 18px;border-radius:999px;font-weight:700;font-size:15px;opacity:0;transition:.25s;z-index:20;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.wimg{position:absolute;pointer-events:none;z-index:0;height:auto;max-width:none}
.bg .wimg{opacity:.75}
.panel > .wimg{opacity:.9}
.pimg{inset:-14px -18px;width:calc(100% + 36px);height:calc(100% + 28px);object-fit:fill;opacity:.95}
#g-t{color:var(--t-blue)}
#n-t{color:var(--t-coral)}
#p-t{color:var(--t-plum)}
#s-t{color:var(--t-teal)}
.amount{color:var(--t-coral)}
.goalrow b{color:var(--t-teal)}
.facts li:nth-child(1) .k{color:var(--t-plum)}
.facts li:nth-child(2) .k{color:var(--t-teal)}
.facts li:nth-child(3) .k{color:var(--t-coral)}
.facts .v{color:var(--t-body)}
.cell.c0{color:var(--t-teal)} .cell.c1{color:var(--t-coral)} .cell.c2{color:var(--t-blue)} .cell.c3{color:var(--t-plum)}
.cell.res{color:#B8285E}.cell.paid,.cell.sel{color:#fff}
.story b{color:var(--t-coral)}
.sign{color:var(--t-plum)}
.pixkey{color:var(--t-plum)}
.holder b{color:var(--t-teal)}
.rg{color:var(--t-teal)}
.rg[aria-pressed="true"]{color:#fff}
.lead{color:var(--t-body)}
.dock-txt b{color:var(--t-coral)}

.panel{isolation:isolate}
.cardbg{position:absolute;inset:0;z-index:0;background:#fff;border-radius:28px;border:2px solid #D6ECF3}
.pix .cardbg{border-color:#FFD3E3}
.board .cardbg{border-color:#DCCBFA}
.panel > .wimg{opacity:.95}
.bg .wimg{opacity:.7}
h1,h2,.amount,.v,.cell,.rg,.sign,.dock-txt b,.dlg h3{font-weight:600}
.facts .v{font-weight:500}
.cell{font-weight:600;font-size:16px}
h2{padding-right:70px}
.panel h2{padding-right:40px}

.photo .wimg{opacity:.85}

.steps{list-style:none;margin:6px 0 18px;padding:0;display:grid;gap:8px}
.steps li{display:flex;align-items:center;gap:10px;font-weight:600}
.steps span{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:var(--hand);font-weight:600;color:#fff}
.steps li:nth-child(1) span{background:#4FC3C8}.steps li:nth-child(2) span{background:#7CB8F2}.steps li:nth-child(3) span{background:#F7739E}
.qty{display:flex;align-items:center;justify-content:center;gap:18px;margin:4px 0 12px}
.qbtn{width:52px;height:52px;border-radius:50%;border:2.5px solid var(--lilac-l);background:#fff;font-size:28px;font-weight:700;line-height:1;cursor:pointer;color:var(--t-plum)}
.qbtn:active{transform:scale(.93)}
.qval{text-align:center;min-width:90px}
.qval b{display:block;font-family:var(--hand);font-weight:600;font-size:52px;line-height:1;color:var(--t-plum)}
.qval small{color:var(--ink2);font-size:14px}
.qchips{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.qchips button{min-width:46px;border:2px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-family:var(--hand);font-weight:600;font-size:17px;color:var(--t-teal);cursor:pointer}
.qchips button[aria-pressed="true"]{background:#4FC3C8;border-color:#4FC3C8;color:#fff}
.qtotal{text-align:center;margin:14px 0 0;font-size:17px}
.qtotal b{font-family:var(--hand);font-weight:600;font-size:26px;color:var(--t-coral)}
.btn.wa{display:block;width:100%;margin-top:16px;background:#25A35A;color:#fff;font-size:17px;padding:14px 20px}
.qnote{font-size:14px;color:var(--ink2);text-align:center;margin:12px 0 0}
.buy .cardbg{border-color:#BFDDF7}
#b-t{color:var(--t-plum)}
.msgbox{background:#F6F3FF;border-radius:14px;padding:12px 14px;margin:0;font-size:15px}

.btn.pixbtn{display:block;width:100%;margin-top:20px;background:#4FC3C8;color:#fff;font-family:var(--hand);font-weight:600;font-size:24px;line-height:1.2;padding:24px 20px;border-radius:26px;box-shadow:0 6px 0 #34A3A8;letter-spacing:.01em}
.btn.pixbtn:active{transform:translateY(4px);box-shadow:0 2px 0 #34A3A8}
.qrwrap{display:flex;flex-direction:column;align-items:center;gap:6px;margin:14px 0 4px}
.qrwrap #qr{padding:10px;background:#fff;border-radius:16px;border:2px solid var(--blue-l)}
.qrwrap #qr img,.qrwrap #qr canvas{display:block;width:160px;height:160px}
.qrwrap small{color:var(--ink2);font-size:13px}
.codebox{width:100%;height:60px;margin-top:6px;border:1.5px dashed var(--line);border-radius:12px;padding:8px 10px;font:12px/1.4 ui-monospace,Menlo,monospace;color:var(--ink2);background:#FAFBFF;resize:none}
.btn.wa{background:#fff;color:#1E8A4C;border:2px solid #9EDBB7}
.whores{margin-top:8px;font-size:15px}
.whores p{margin:0 0 6px;padding:10px 14px;background:#fff;border-radius:14px;border:2px solid var(--lilac-l)}
.whores b{color:var(--t-plum)}
.find.findme{background:var(--teal);color:#fff;font-weight:800;font-size:17px;padding:14px 16px;border-radius:20px;flex-wrap:wrap;box-shadow:0 5px 0 #34A3A8}
.dons{margin-top:18px;background:rgba(255,255,255,.75);border-radius:16px;padding:12px 16px}
.dons-h{font-weight:800;font-size:15px;display:flex;justify-content:space-between;gap:8px;margin-bottom:6px}
.dons-h span{color:var(--t-teal)}
.dons ul{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:15px}
.dons li{display:flex;justify-content:space-between;gap:10px;border-top:1px dashed var(--line);padding-top:4px}
.dons li:first-child{border-top:0;padding-top:0}
.dons small{color:var(--ink2);font-size:12.5px}
.dons-more{display:block;margin:2px 0 0;background:none;border:0;color:var(--ink);font:inherit;font-size:15px;line-height:1;cursor:pointer;padding:2px 0 4px}
.find.findme input{background:#fff;border:0;color:var(--ink);min-width:160px;padding:10px 16px;font-size:16px}
.swipe{font-size:14px;font-weight:700;color:var(--t-teal);margin:0 0 8px}
.board .in{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:10px}
#grid.grid{display:grid;grid-auto-flow:column;grid-template-rows:repeat(10,40px);grid-auto-columns:40px;grid-template-columns:none;gap:8px;justify-content:start;width:max-content}
#grid .cell{font-size:12px;border-width:1.5px}
.admin-on #grid.grid{row-gap:22px}
@media (max-width:979px){section[aria-labelledby="n-t"] .board{margin-right:-20px;padding-right:0}section[aria-labelledby="n-t"] .board .cardbg{border-radius:28px 0 0 28px;border-right:0}section[aria-labelledby="n-t"] .board .in{padding-right:14px}}
@media (min-width:640px) and (max-width:979px){section[aria-labelledby="n-t"] .board{margin-right:-32px}}
.dlg .sel{width:100%;border:2px solid var(--line);background:#FFFEFB;color:#222;border-radius:14px;padding:10px 12px;font:inherit}
</style>
</head>

function strip(s){return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^A-Za-z0-9 ]/g,"").trim().toUpperCase();}
function pixKey(c){var k=String(c.pix||"").trim(),t=c.pixType||"cpf";
  if(t==="email")return k.toLowerCase();
  if(t==="random")return k.toLowerCase();
  var d=k.replace(/\D/g,"");
  if(t==="phone"){if(d.length<=11)d="55"+d;return "+"+d;}
  return d;}
function f(id,v){v=String(v);return id+String(v.length).padStart(2,"0")+v;}
function crc16(s){var c=0xFFFF;for(var i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(var j=0;j<8;j++){c=(c&0x8000)?((c<<1)^0x1021):(c<<1);c&=0xFFFF;}}return c.toString(16).toUpperCase().padStart(4,"0");}
function pixCode(c,amount,txid){
  var name=strip(c.holder).slice(0,25), city=strip(c.city||"Curitiba").slice(0,15);
  if(!c.pix||!name)return "";
  var p=f("00","01")+f("26",f("00","br.gov.bcb.pix")+f("01",pixKey(c)))+f("52","0000")+f("53","986")+f("54",amount.toFixed(2))+f("58","BR")+f("59",name)+f("60",city)+f("62",f("05",txid))+"6304";
  return p+crc16(p);
}

   '<div class="seg" role="group" aria-label="Situação"><button type="button" data-s="" aria-pressed="'+(s==="")+'">Livre</button><button type="button" data-s="r" aria-pressed="'+(s==="r")+'">Reservado</button><button type="button" data-s="p" aria-pressed="'+(s==="p")+'">Pago</button></div>'+
   '<div class="row"><button class="btn soft" value="cancel">Cancelar</button><button class="btn" id="okn" value="ok">Aplicar</button></div>';
  f.querySelectorAll(".seg button").forEach(function(b){b.addEventListener("click",function(){s=b.dataset.s;f.querySelectorAll(".seg button").forEach(function(y){y.setAttribute("aria-pressed",String(y===b))})})});
  var d=document.getElementById("numdlg");
  d.onclose=function(){
    if(d.returnValue!=="ok")return;
    var name=document.getElementById("nm").value.trim().slice(0,40);
    var val=s?{s:s,n:name}:null, orig=S.numbers[n]||null;
    if(JSON.stringify(val)===JSON.stringify(orig))delete pending[n]; else pending[n]=val;
    renderAll();
  };
  d.returnValue=""; d.showModal();
}

function openSettings(){
  var c=cfg(), f=document.getElementById("setform");
  f.innerHTML='<h3>Dados da rifa</h3>'+
   '<label for="s-wa">WhatsApp para reservas</label><input id="s-wa" inputmode="tel" value="'+esc(c.whatsapp)+'" placeholder="(41) 99999-9999">'+
   '<label for="s-pt">Tipo da chave PIX</label><select id="s-pt" class="sel">'+[["cpf","CPF ou CNPJ"],["phone","Celular"],["email","E-mail"],["random","Chave aleatória"]].map(function(o){return '<option value="'+o[0]+'"'+((c.pixType||"cpf")===o[0]?" selected":"")+'>'+o[1]+'</option>'}).join("")+'</select>'+
   '<label for="s-pix">Chave PIX</label><input id="s-pix" value="'+esc(c.pix)+'">'+
   '<label for="s-h">Titular do PIX</label><input id="s-h" value="'+esc(c.holder)+'"><p class="hint">Nome igual ao da conta. Ele vai dentro do código PIX.</p>'+
   '<label for="s-city">Cidade do titular</label><input id="s-city" value="'+esc(c.city||"Curitiba")+'">'+
   '<label for="s-t">Quantidade de números</label><input id="s-t" type="number" min="10" max="2000" value="'+c.total+'">'+
   '<label for="s-pr">Valor de cada número (R$)</label><input id="s-pr" type="number" min="1" step="0.01" value="'+c.price+'">'+
   '<label for="s-x">Doações recebidas fora da rifa (R$)</label><input id="s-x" type="number" min="0" step="0.01" value="'+(c.extra||0)+'"><p class="hint">Some aqui os PIX de doação para a barra da meta ficar certa.</p>'+
   '<label for="s-pz">Prêmio</label><input id="s-pz" value="'+esc(c.prize)+'">'+
   '<label for="s-d">Sorteio</label><input id="s-d" value="'+esc(c.draw)+'">'+
   '<div class="row"><button class="btn soft" value="cancel">Cancelar</button><button class="btn" value="ok">Aplicar</button></div>';
  var d=document.getElementById("setdlg");
  d.onclose=function(){
    if(d.returnValue!=="ok")return;
    var v=function(id){return document.getElementById(id).value.trim()};
    var next={whatsapp:v("s-wa"),pix:v("s-pix"),pixType:document.getElementById("s-pt").value,city:v("s-city")||"Curitiba",holder:v("s-h"),total:Math.max(10,Math.min(2000,parseInt(v("s-t"),10)||S.total)),price:Math.max(1,parseFloat(v("s-pr"))||S.price),extra:Math.max(0,parseFloat(v("s-x"))||0),prize:v("s-pz")||S.prize,draw:v("s-d")||S.draw};
    var changed=Object.keys(next).some(function(k){return String(next[k])!==String(S[k])});
    settingsDirty=changed?next:null;
    renderAll();
  };
  d.returnValue=""; d.showModal();
}

function buildDoc(state){
  var json=JSON.stringify(state).replace(/</g,"\\u003c");
  var head=document.getElementById("head-src").textContent;
  return head+"<style id=\"css\">"+document.getElementById("css").textContent+"<\/style>\n</head>\n<body>\n<div id=\"root\"></div>\n"+
   "<script id=\"head-src\" type=\"text/plain\">"+head.replace(/<\/script/gi,"<\\/script")+"<\/script>\n"+
   "<script id=\"photo\" type=\"text/plain\">"+PHOTO+"<\/script>\n"+
   "<script id=\"wc\" type=\"application/json\">"+document.getElementById("wc").textContent+"<\/script>\n"+
   "<script id=\"state\" type=\"application/json\">"+json+"<\/script>\n"+
   "<script id=\"app\">"+document.getElementById("app").textContent+"<\/script>\n</body>\n</html>\n";
}

function save(){
  if(saving||!pendingCount())return;
  if(!artifactNs){toast("Salvar não está disponível nesta visualização");return;}
  var next=JSON.parse(JSON.stringify(S));
  if(settingsDirty)Object.assign(next,settingsDirty);
  Object.keys(pending).forEach(function(n){ if(pending[n])next.numbers[n]=pending[n]; else delete next.numbers[n]; });
  Object.keys(next.numbers).forEach(function(n){ if(+n>next.total)delete next.numbers[n]; });
  next.updated=new Date().toISOString();
  try{sessionStorage.setItem("davi-pending",JSON.stringify({p:pending,s:settingsDirty}))}catch(e){}
  saving=true;renderDock();
  artifactNs.publish(buildDoc(next)).then(function(){
    try{sessionStorage.removeItem("davi-pending")}catch(e){}
    S=next;pending={};settingsDirty=null;saving=false;renderAll();toast("Alterações salvas");
  },function(err){
    saving=false;
    var code=err&&err.code;
    if(code==="conflict"){toast("A página foi atualizada em outro lugar. Recarregando…");return;}
    try{sessionStorage.removeItem("davi-pending")}catch(e){}
    if(code==="not_writer"||code==="not_granted"){readOnly=true;canAdmin=false;admin=false;renderAll();toast("Esta visualização é só para consulta");return;}
    if(code==="rate_limited"){toast("Muitas alterações seguidas. Espere um pouco e salve de novo.");renderDock();return;}
    toast("Não foi possível salvar agora. Tente de novo em instantes.");renderDock();
  });
}

function copy(t,elId,okMsg){
  var done=function(){toast(okMsg||"Chave PIX copiada")};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done,fallback);}else fallback();
  function fallback(){var el=document.getElementById(elId||"pixkey");if(el&&el.tagName==="TEXTAREA"){el.focus();el.select();}else{var r=document.createRange();r.selectNodeContents(el);var s=getSelection();s.removeAllRanges();s.addRange(r);}try{document.execCommand("copy");done();}catch(e){toast("Segure a chave para copiar")}}
}
var tt;function toast(m){var t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(function(){t.classList.remove("show")},2600);}

shell();renderAll();
(function(){var sc=document.querySelector('section[aria-labelledby="n-t"] .board .in');if(!sc)return;try{if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;}catch(e){}var dir=1,stop=false,last=0,pause=0,pos=0;function stopIt(){stop=true;}['pointerdown','touchstart','wheel','keydown'].forEach(function(ev){sc.addEventListener(ev,stopIt,{passive:true});});function step(t){if(stop||admin)return;if(!last)last=t;var dt=Math.min(t-last,50);last=t;var max=sc.scrollWidth-sc.clientWidth;if(max>0){if(pause>0){pause-=dt;}else{pos+=dir*dt*0.06;if(pos>=max){pos=max;dir=-1;pause=1500;}else if(pos<=0){pos=0;dir=1;pause=1500;}sc.scrollLeft=pos;}}requestAnimationFrame(step);}setTimeout(function(){requestAnimationFrame(step);},1500);})();

if(window.claude&&window.claude.use){
  window.claude.use("artifact").then(function(a){artifactNs=a;}).catch(function(){});
  window.claude.use("user").then(function(u){
    if(!u)return;
    return u.canEdit().then(function(ok){ if(ok){canAdmin=true; if(pendingCount())admin=true; renderAll();} });
  }).catch(function(){});
}
})();
</script>
